<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title><!--TITLE--></title>
<link rel="icon" type="image/svg+xml" href="<!--BASE-->favicon.svg">
<!--SCENELIST-->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#26211d;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#card{position:fixed;left:24px;bottom:24px;width:min(390px,calc(100vw - 32px));opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease;pointer-events:none;color:#2F2729;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;box-shadow:0 12px 34px rgba(0,0,0,.4);--acc:#E0453A}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card canvas{position:absolute;inset:0;width:100%;height:100%}
#card .in{position:relative;padding:24px 28px 20px}
.kick{font-variant:small-caps;letter-spacing:.16em;font-size:13px;color:var(--acc)}
#card h1{font-weight:normal;font-size:35px;line-height:1.04;margin:6px 0 12px;letter-spacing:.005em}
.orn{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--acc)}.orn i{flex:1;height:1px;background:currentColor;opacity:.8}.orn b{width:6px;height:6px;transform:rotate(45deg);background:currentColor}
.q{font-style:italic;font-size:16.5px;line-height:1.46;margin:0;hyphens:auto}
.q .dc{float:left;font-style:normal;font-size:60px;line-height:.8;padding:5px 7px 0 0;color:var(--acc)}.q .dc small{font-size:26px;vertical-align:top;margin-right:1px}
.src{font-size:12.5px;letter-spacing:.08em;margin-top:12px;opacity:.72;font-variant:small-caps;clear:both}
.lk{display:inline-block;margin-top:10px;color:var(--acc);font-size:14.5px;cursor:pointer;border-bottom:1px solid currentColor;text-decoration:none;font-style:italic}
.more{max-height:0;overflow:hidden;transition:max-height .7s ease}.more.open{max-height:52vh;overflow:auto}
.more p{font-size:14.5px;line-height:1.52;margin:12px 0 0}.more p.orig{font-size:13px;opacity:.78;border-top:1px solid var(--acc);padding-top:10px}
.bk{margin:12px 0 0;padding:10px 0 2px;border-top:1px solid var(--acc)}.bk+.bk{border-top-style:dotted}
.bl{font-variant:small-caps;letter-spacing:.12em;font-size:12.5px;color:var(--acc)}
.more .bk p{margin:5px 0 0}.bk .he{font-family:"Taamey Frank CLM","SBL Hebrew","Times New Roman","Arial Hebrew","David",serif;font-size:21px;line-height:1.6;text-align:right}
.more .bk .ph{font-style:italic;font-size:14.5px}.more .bk .tr{font-size:14px}.more .bk .bn{font-size:12.5px;opacity:.72}
@media (max-width:640px){#card{left:12px;bottom:12px;width:calc(100vw - 24px)}#card .in{padding:16px 18px 14px}#card h1{font-size:26px}.q{font-size:14.5px}.q .dc{font-size:46px}}
#help{position:fixed;top:20px;right:20px;max-width:calc(100vw - 40px);padding:9px 14px;background:rgba(244,233,211,.92);color:#2F2729;font:italic 13.5px/1.45 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:opacity .8s ease;pointer-events:auto}
#help b{font-style:normal;font-weight:normal;font-variant:small-caps;letter-spacing:.08em;color:#E0453A}
#help.dim{opacity:.35}#help.dim:hover{opacity:1}
@media (max-width:640px){#help{top:12px;right:12px;left:12px;max-width:none;font-size:12.5px;text-align:center}}
#printbtn{position:fixed;right:20px;bottom:20px;z-index:40;padding:9px 14px;border:0;background:rgba(244,233,211,.92);color:#2F2729;font:italic 14px/1.2 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
#printbtn b{font-style:normal;font-weight:normal;font-variant:small-caps;letter-spacing:.08em;color:#E0453A}
#card .lkp,#card .lko{margin-left:16px}
#card .x{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:4px;border:0;background:none;color:var(--acc);cursor:pointer;transition:transform .35s ease}
#card .x svg{display:block;width:100%;height:100%}
#card .x:hover,#card .x:focus-visible{transform:rotate(30deg) scale(1.12)}
#card .x:focus-visible{outline:1px dashed currentColor}
#print{display:none}
@media (max-width:640px){#printbtn{right:12px;bottom:auto;top:72px;font-size:13px}}
@page{size:A4;margin:14mm 16mm}
@media print{
  html,body{height:auto;overflow:visible;background:#fff!important;touch-action:auto}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#2F2729;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .pk{font-variant:small-caps;letter-spacing:.16em;font-size:10pt;color:#E0453A}
  #print .ph{text-align:center;padding-top:20mm}
  #print .ph h1{font-weight:normal;font-size:34pt;margin:4mm 0 2mm}
  #print .ps2{font-style:italic;color:#E0453A;font-size:12pt}
  #print .ph ol{text-align:left;max-width:120mm;margin:14mm auto 0;font-size:12pt;line-height:1.7}
  #print .ph ol span{font-style:italic;opacity:.7;font-size:10.5pt}
  #print[data-only]:not([data-only=""]) .ph{display:none}
  #print .ps{break-before:page}
  #print[data-only]:not([data-only=""]) .ps{break-before:auto}
  #print .ps header{border-bottom:1px solid var(--acc);padding-bottom:3mm;margin-bottom:4mm}
  #print .ps .pk{color:var(--acc)}
  #print .ps h2{font-weight:normal;font-size:22pt;margin:1mm 0}
  #print .pr{font-size:10.5pt;font-variant:small-caps;letter-spacing:.08em;opacity:.75}
  #print .pi{text-align:center;margin:0 0 4mm}
  #print .pi canvas{width:96mm;height:96mm}
  #print blockquote{margin:0 0 4mm;font-style:italic;font-size:13pt;line-height:1.45;border-left:3px solid var(--acc);padding-left:5mm;break-inside:avoid}
  #print cite{display:block;font-style:normal;font-size:9.5pt;font-variant:small-caps;letter-spacing:.08em;opacity:.7;margin-top:1.5mm}
  #print .po{font-size:10pt;line-height:1.45;opacity:.8;margin:0 0 5mm;padding-left:5mm;break-inside:avoid}
  #print .pho{font-family:"Taamey Frank CLM","SBL Hebrew","Times New Roman","Arial Hebrew","David",serif;font-size:13pt;line-height:1.6;text-align:right;padding:0 5mm 0 0}#print .pho cite{text-align:left}
  #print .pm h3{font-weight:normal;font-variant:small-caps;letter-spacing:.12em;font-size:11pt;color:var(--acc);margin:0 0 2mm}
  #print .pm p{font-size:10.5pt;line-height:1.5;margin:0 0 3mm;text-align:justify;hyphens:auto}
  #print .pb .bk{break-inside:avoid;margin:0 0 3mm;padding:2mm 0 0}
  #print .pb .bk p{margin:1mm 0 0;text-align:left}#print .pb .bk .he{font-size:16pt;text-align:right}
  #print .pb .bk .ph{font-style:italic}#print .pb .bk .bn{font-size:9.5pt;opacity:.75}
  #print .pf{margin-top:8mm;text-align:center;font-size:9pt;opacity:.6}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help"><b>Double-clic</b> sur une scène pour y entrer · <b>glisser</b> pour se déplacer · <b>molette</b> pour zoomer · <b>0</b> vue d’ensemble · <b>C</b> carte · <b>P</b> imprimer</div>
<div id="card"><canvas></canvas><div class="in"></div><button class="x" type="button" title="Fermer et revenir à la vue d’ensemble (Échap)" aria-label="Fermer et revenir à la vue d’ensemble"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 20.2 16.7H3.8Z M12 21.5 3.8 7.3H20.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button></div>
<button id="printbtn" type="button" title="Imprimer ou enregistrer en PDF (touche P)"><b>Imprimer</b> · PDF</button>
<div id="print"></div>
<script>
